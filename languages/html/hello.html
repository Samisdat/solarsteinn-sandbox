<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, world</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; }
      .hello { color: #663399; }
    </style>
    <script type="module">
      const el = document.querySelector('.hello');
      el?.addEventListener('click', () => alert('Hello!'));
    </script>
  </head>
  <body>
    <!-- a comment -->
    <header id="top" class="hello" data-lang="en">
      <h1>Hello, <em>world</em>!</h1>
    </header>
    <main>
      <p>Entities: &amp; &lt; &gt; &copy; &#x1F600;</p>
      <a href="https://example.com/?a=1&amp;b=2" target="_blank" rel="noopener">Link</a>
      <img src="logo.png" alt="Logo" width="64" height="64" />
      <form action="/greet" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required placeholder="world" />
        <button type="submit" disabled>Greet</button>
      </form>
      <ul>
        <li>One</li>
        <li>Two</li>
      </ul>
    </main>
  </body>
</html>
